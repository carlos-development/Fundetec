{% if field.is_hidden %}{{ field }}{% else %}
<div class="edu-recaudos-field{% if field.errors %} has-error{% endif %}">
    {{ field.label_tag }}{{ field }}
    {% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
    {{ field.errors }}
</div>
{% endif %}
