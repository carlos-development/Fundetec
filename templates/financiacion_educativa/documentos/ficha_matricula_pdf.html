<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ficha de matr&iacute;cula {{ numero_documento }}</title>
  <style>
    @page { size: Letter; margin: 0; }
    * { box-sizing: border-box; }
    body { color: #111; font: 6.7pt Arial, Helvetica, sans-serif; margin: 0; }
    .ficha-page { height: 279.4mm; overflow: hidden; padding: 10mm 11mm 9mm; position: relative; width: 215.9mm; }
    table { border-collapse: collapse; width: 100%; }
    th, td { vertical-align: top; }
    .ficha-header td { border: 0; padding: 0; vertical-align: middle; }
    .ficha-header .ficha-logo { padding: 0 4mm 1mm 0; width: 18%; }
    .ficha-header img { display: block; height: auto; max-width: 100%; }
    .ficha-header .ficha-institution, .ficha-header .ficha-title { border-bottom: .55pt solid #777; font-weight: 700; padding: 1.1mm 0; text-align: center; }
    .ficha-header .ficha-institution { font-size: 8.5pt; }
    .ficha-header .ficha-title { font-size: 10pt; }
    .ficha-meta { margin: 0 0 2.2mm; }
    .ficha-meta td { border: 0; border-bottom: .45pt solid #999; font-size: 6.3pt; padding: 1.3mm .6mm; text-align: center; }
    .ficha-meta td:first-child { text-align: left; }
    .ficha-meta td:last-child { text-align: right; }
    .ficha-section { break-inside: avoid; margin-top: 2.2mm; }
    .ficha-section h2 { font-size: 8pt; margin: 0 0 1mm; }
    .ficha-section h2::after { background: #bcbcbc; content: ""; display: block; height: 1.5pt; margin-top: .7mm; width: 38%; }
    .ficha-personal-layout td { border: 0; padding: 0; vertical-align: top; }
    .ficha-personal-layout .ficha-data-cell { padding-right: 3mm; width: 84%; }
    .ficha-personal-layout .ficha-photo-cell { width: 16%; }
    .ficha-photo-label { font-size: 6pt; margin-bottom: .6mm; text-align: center; }
    .ficha-photo-box { border: .55pt solid #888; height: 27mm; margin: 0 auto; width: 21mm; }
    .ficha-fields th, .ficha-fields td, .ficha-striped th, .ficha-striped td { border: 0; padding: .65mm 1mm; }
    .ficha-fields th, .ficha-striped th { font-weight: 700; text-align: right; width: 18%; }
    .ficha-fields td, .ficha-striped td { overflow-wrap: anywhere; width: 32%; }
    .ficha-striped tr:nth-child(odd) { background: #e4e4e4; }
    .ficha-striped tr { border-bottom: .35pt solid #999; }
    .ficha-retirement th, .ficha-retirement td { border: .45pt solid #999; height: 5mm; padding: .8mm; text-align: center; }
    .ficha-signature-note { border: .45pt solid #aaa; font-size: 6.1pt; margin-top: 2.5mm; padding: 1.2mm; text-align: center; }
    .ficha-signatures { margin-top: 7mm; }
    .ficha-signatures td { border: 0; padding: 0 5mm 6mm; text-align: center; width: 50%; }
    .ficha-signatures span { border-bottom: .55pt solid #222; display: block; font-weight: 700; padding-bottom: 1mm; }
    .ficha-signatures strong, .ficha-signatures small { display: block; font-weight: 400; padding-top: .8mm; }
    .ficha-signatures small { color: #555; font-size: 5.7pt; }
    .ficha-footer { border-top: .45pt solid #999; color: #444; font-size: 5.8pt; margin-top: 0; padding-top: 1mm; text-align: center; }
  </style>
</head>
<body>
  <section class="ficha-page">
    {% include "financiacion_educativa/documentos/_ficha_matricula_contenido.html" %}
  </section>
</body>
</html>
