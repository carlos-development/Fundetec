{% load brand_tags %}
<div class="email-footer">
    <img src="{% brand_static_url 'logo_dark' %}" alt="{% brand_value 'name' %}" class="footer-logo">
    <p class="footer-company">{% brand_value 'legal_name' %}</p>
    <p class="footer-address">Villavicencio, Meta, Colombia</p>
    <div class="footer-links">
        <a href="{% brand_value 'public_base_url' %}/terminos">Términos</a>
        <a href="{% brand_value 'public_base_url' %}/privacidad">Privacidad</a>
        <a href="{% brand_value 'public_base_url' %}/libranza/#preguntas-frecuentes">Ayuda</a>
    </div>
</div>
