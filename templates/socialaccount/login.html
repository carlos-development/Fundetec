{% extends "socialaccount/base_socialaccount.html" %}
{% load static socialaccount %}

{% block content %}
<section class="edu-auth-main">
    <div class="edu-auth-panel">
        <img class="edu-auth-logo" src="{% static education_brand.logo_inverse|default:'images/logo.png' %}" alt="Aprobado">
        <span class="edu-status-symbol"><i class="bi bi-google" aria-hidden="true"></i></span>
        <h1>Contin&uacute;a con Google</h1>
        <p class="edu-auth-description">Confirma el acceso con tu cuenta de Google para regresar a tu solicitud de financiaci&oacute;n educativa.</p>
        <form method="post" class="edu-form social-login-confirm">
            {% csrf_token %}
            <button type="submit" class="edu-button edu-button-wide">
                <i class="bi bi-google" aria-hidden="true"></i>
                Continuar con Google
            </button>
        </form>
        <div class="edu-auth-links">
            <a href="/accounts/login/">Volver al acceso con correo</a>
        </div>
    </div>
</section>

<script>
    window.addEventListener("DOMContentLoaded", function () {
        const params = new URLSearchParams(window.location.search);
        const form = document.querySelector(".social-login-confirm");
        if (params.get("process") === "login" && form) {
            form.submit();
        }
    });
</script>
{% endblock %}
